{{ $platinumSponsors := where (where site.RegularPages "Section" "sponsors") "Params.level" "Platinum" }}
{{ if $platinumSponsors }}
<section class="sponsor-bar">
  <div class="sponsor-bar-inner">
    <p class="sponsor-bar-label">Platinum Sponsors</p>
    <div class="sponsor-bar-logos">
      {{ range $platinumSponsors }}
        {{ partial "logo.html" (dict "Page" . "Params" (dict "width" "180")) }}
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
